{% extends 'core/base.html' %}

{% block title %}Nueva contraseña | Ducky Arena{% endblock %}

{% block main %}
<section class="auth-shell">
    <div class="panel auth-panel">
        <h1>Crear nueva contraseña</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Guardar contraseña</button>
        </form>
    </div>
</section>
{% endblock %}
